# Configuration file for MegaLinter
# See all available variables at https://megalinter.io/latest/configuration/ and in linters documentation

MEGALINTER_FLAVOR: javascript
MEGALINTER_VERSION: v10
APPLY_FIXES: none # all, none, or list of linter keys
# ENABLE: # If you use ENABLE variable, all other languages/formats/tooling-formats will be disabled by default
# ENABLE_LINTERS: # If you use ENABLE_LINTERS variable, all other linters will be disabled by default
# DISABLE:
# - COPYPASTE # Uncomment to disable checks of excessive copy-pastes
# - SPELL # Uncomment to disable checks of spelling mistakes
SHOW_ELAPSED_TIME: true
FILEIO_REPORTER: false
DISABLE_ERRORS_LINTERS:
  - ACTION_ACTIONLINT
  - REPOSITORY_TRUFFLEHOG
  - SPELL_LYCHEE
SPELL_FILTER_REGEX_EXCLUDE: (github-dependents-info|\.claude/)
DISABLE_LINTERS:
  - TYPESCRIPT_STANDARD
PRE_COMMANDS:
  - command: yarn install --frozen-lockfile --production=false
    cwd: workspace
    run_before_linters: true
  - command: 'echo "DIAG NODE_ENV=$NODE_ENV size=$(du -sh node_modules 2>&1)"'
    cwd: workspace
    run_before_linters: true
JSON_JSONLINT_FILTER_REGEX_EXCLUDE: (\.vscode|tsconfig\.json)
MARKDOWN_MARKDOWNLINT_FILTER_REGEX_EXCLUDE: (\\.github|\.claude/)
COPYPASTE_JSCPD_FILTER_REGEX_EXCLUDE: (\.claude/|docs/github-dependents-info)
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
REPOSITORY_TRIVY_ARGUMENTS:
  - --skip-dirs
  - ./node_modules/uri-js
TYPESCRIPT_DEFAULT_STYLE: prettier
FILTER_REGEX_EXCLUDE: (github-dependents-info\.md)
MARKDOWN_FILTER_REGEX_EXCLUDE: (docs)
